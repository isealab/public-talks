name: Render R Markdown

on:
  push:
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Install R packages
        run: |
          install.packages(c("knitr", "rmarkdown"), repos = "https://cloud.r-project.org")
          stopifnot(requireNamespace("rmarkdown", quietly = TRUE))
        shell: Rscript {0}

      - name: Render talks
        run: Rscript scripts/render_rmarkdown.R

      - name: Verify generated talk catalog
        run: |
          python3 scripts/generate_talk_catalog.py
          git diff --exit-code -- TALK_CATALOG.md TALK_CATALOG.json index.html
